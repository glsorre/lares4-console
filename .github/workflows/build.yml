name: Build and Release

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test the project (node:test)
        run: npm test

      - name: Coverage for Codecov (node:test → lcov)
        if: ${{ matrix.node-version == '22.x' }}
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: ${{ matrix.node-version == '22.x' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          verbose: true

      - name: Lint the project
        run: npm run lint

      - name: Build the project (Vite)
        run: npm run build

      - name: Upload web dist (tags, Node 22 only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.node-version == '22.x' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-web
          path: dist-desktop
          retention-days: 14

  tauri-build-linux:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri/Linux dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Cargo cache (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Tauri bundle (Linux)
        run: npm run tauri:build

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-bundles
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build
      - tauri-build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: dist-desktop-web
          path: web-dist

      - name: Download Tauri bundles
        uses: actions/download-artifact@v4
        with:
          name: tauri-linux-bundles
          path: tauri-bundles

      - name: Zip web frontend
        run: (cd web-dist && zip -r "${GITHUB_WORKSPACE}/web-dist-desktop-${{ github.ref_name }}.zip" .)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          body: ${{ github.event.head_commit.message }}
          generate_release_notes: true
          files: |
            web-dist-desktop-${{ github.ref_name }}.zip
            tauri-bundles/**/*

