[package]
name = "app"
version = "0.1.0"
description = "Desktop debug console for Lares4 panels"
authors = ["Giuseppe Lucio Sorrentino"]
license = "SEE LICENSE IN LICENSE-NOTICE.md"
repository = "https://github.com/glsorre/lares4-console"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
dirs = "6"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
base64 = "0.22"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
keychain-it = []
